name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fails if a zero-unsafe crate (micro, host, capability, resource) contains
      # any `unsafe` code. See scripts/unsafe-count.sh.
      - name: Unsafe audit
        run: bash scripts/unsafe-count.sh

      # Fails if docs/standards/compat.md is out of date with feature-registry.toml,
      # or if the registry is internally inconsistent. See scripts/gen-compat.py.
      - name: Compatibility page is current
        run: python3 scripts/gen-compat.py --check

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo check
        run: cargo check --workspace --all-targets

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  # Builds the CLI twice in fresh target directories and fails unless the binaries
  # match. See scripts/repro-check.sh for what is controlled and why.
  reproducible:
    name: Reproducible build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build twice and compare
        run: bash scripts/repro-check.sh

  # The bill of materials is built from the locked dependency graph and kept as a
  # workflow artifact, so every run records exactly what it was built from.
  sbom:
    name: Software bill of materials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate CycloneDX SBOM
        run: python3 scripts/sbom.py sbom.cdx.json

      - name: Keep the SBOM with the run
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

  # The native target is covered by `check`. These type-check the whole workspace,
  # tests included, for the other targets the project commits to.
  cross-check:
    name: Type-check for ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-unknown-linux-gnu, riscv64gc-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable with ${{ matrix.target }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: cargo check --target ${{ matrix.target }}
        run: cargo check --workspace --all-targets --target ${{ matrix.target }}

  deny:
    name: License and advisory audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v1
        with:
          command: check
          arguments: --all-features

  lean:
    name: Lean 4 proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        uses: elan-actions/elan@v1

      # The model has no external dependencies, so the toolchain pinned in
      # formal/lean-toolchain is all that is needed to check every proof.
      - name: Build the formal model
        working-directory: formal
        run: lake build

      - name: Fail on any `sorry` or `axiom`
        working-directory: formal
        run: |
          if grep -rn --include='*.lean' -E '\bsorry\b|^ *axiom ' TptWasm TptWasm.lean; then
            echo "::error::the formal model must not use sorry or axiom"
            exit 1
          fi

  spec-tests:
    name: WebAssembly spec tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run spec tests
        run: cargo test --workspace --test spec -- --nocapture
        # TODO(M2): enable once spec test runner is implemented
        continue-on-error: true
