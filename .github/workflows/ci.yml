name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fails if a zero-unsafe crate (micro, host, capability, resource) contains
      # any `unsafe` code. See scripts/unsafe-count.sh.
      - name: Unsafe audit
        run: bash scripts/unsafe-count.sh

      # Fails if docs/standards/compat.md is out of date with feature-registry.toml,
      # or if the registry is internally inconsistent. See scripts/gen-compat.py.
      - name: Compatibility page is current
        run: python3 scripts/gen-compat.py --check

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo check
        run: cargo check --workspace --all-targets

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  # Builds the CLI twice in fresh target directories and fails unless the binaries
  # match. See scripts/repro-check.sh for what is controlled and why.
  reproducible:
    name: Reproducible build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build twice and compare
        run: bash scripts/repro-check.sh

  # The bill of materials is built from the locked dependency graph and kept as a
  # workflow artifact, so every run records exactly what it was built from.
  sbom:
    name: Software bill of materials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate CycloneDX SBOM
        run: python3 scripts/sbom.py sbom.cdx.json

      - name: Keep the SBOM with the run
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

  # The native target is covered by `check`. These type-check the whole workspace,
  # tests included, for the other targets the project commits to. `cross-test` below
  # runs the tests on them.
  cross-check:
    name: Type-check for ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-unknown-linux-gnu, riscv64gc-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable with ${{ matrix.target }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: cargo check --target ${{ matrix.target }}
        run: cargo check --workspace --all-targets --target ${{ matrix.target }}

  # Runs the whole test suite for the other targets under user-mode QEMU, so the
  # code is executed on those architectures and not only type-checked. The cargo
  # runner is the emulator; the linker is the cross GCC for the same target.
  cross-test:
    name: Test under QEMU for ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            env_prefix: CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU
            linker_package: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
            runner: qemu-aarch64 -L /usr/aarch64-linux-gnu
          - target: riscv64gc-unknown-linux-gnu
            env_prefix: CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU
            linker_package: gcc-riscv64-linux-gnu
            linker: riscv64-linux-gnu-gcc
            runner: qemu-riscv64 -L /usr/riscv64-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU user mode and the cross linker
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user ${{ matrix.linker_package }}

      - name: Install Rust stable with ${{ matrix.target }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Point cargo at the cross linker and the emulator
        run: |
          echo "${{ matrix.env_prefix }}_LINKER=${{ matrix.linker }}" >> "$GITHUB_ENV"
          echo "${{ matrix.env_prefix }}_RUNNER=${{ matrix.runner }}" >> "$GITHUB_ENV"

      - name: cargo test --target ${{ matrix.target }}
        run: cargo test --workspace --target ${{ matrix.target }}

  deny:
    name: License and advisory audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  lean:
    name: Lean 4 proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # elan-actions/elan does not exist on GitHub, so install elan from the
      # official installer. No default toolchain is set: `lake build` reads
      # formal/lean-toolchain and fetches that exact version.
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # The model has no external dependencies, so the toolchain pinned in
      # formal/lean-toolchain is all that is needed to check every proof.
      - name: Build the formal model
        working-directory: formal
        run: lake build

      - name: Fail on any `sorry` or `axiom`
        working-directory: formal
        run: |
          # Comments and docstrings are blanked first, so prose that mentions
          # `sorry` (the proof files explain the rule) is not flagged.
          python3 - <<'PY'
          import pathlib, re, sys
          pat = re.compile(r'\bsorry\b|^\s*axiom\s')
          files = list(pathlib.Path('TptWasm').rglob('*.lean')) + [pathlib.Path('TptWasm.lean')]
          bad = []
          for p in files:
              text = p.read_text(encoding='utf-8')
              text = re.sub(r'/-.*?-/', lambda m: '\n' * m.group(0).count('\n'), text, flags=re.S)
              text = re.sub(r'--[^\n]*', '', text)
              for n, line in enumerate(text.splitlines(), 1):
                  if pat.search(line):
                      bad.append(f'{p}:{n}: {line.strip()}')
          if bad:
              print('\n'.join(bad))
              print('::error::the formal model must not use sorry or axiom')
              sys.exit(1)
          PY

  spec-tests:
    name: WebAssembly spec tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run spec tests
        run: cargo test --workspace --test spec -- --nocapture
        # TODO(M2): enable once spec test runner is implemented
        continue-on-error: true
