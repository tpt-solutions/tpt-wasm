name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo check
        run: cargo check --workspace --all-targets

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  deny:
    name: License and advisory audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v1
        with:
          command: check
          arguments: --all-features

  lean:
    name: Lean 4 proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        uses: elan-actions/elan@v1

      # The model has no external dependencies, so the toolchain pinned in
      # formal/lean-toolchain is all that is needed to check every proof.
      - name: Build the formal model
        working-directory: formal
        run: lake build

      - name: Fail on any `sorry` or `axiom`
        working-directory: formal
        run: |
          if grep -rn --include='*.lean' -E '\bsorry\b|^ *axiom ' TptWasm TptWasm.lean; then
            echo "::error::the formal model must not use sorry or axiom"
            exit 1
          fi

  spec-tests:
    name: WebAssembly spec tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run spec tests
        run: cargo test --workspace --test spec -- --nocapture
        # TODO(M2): enable once spec test runner is implemented
        continue-on-error: true
