[package]
name = "tpt-wasm-decode-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tpt-wasm-decode = { path = "../crates/tpt-wasm-decode" }
tpt-wasm-oracle = { path = "../crates/tpt-wasm-oracle" }
tpt-wasm-jit = { path = "../crates/tpt-wasm-jit" }
tpt-wasm-runtime = { path = "../crates/tpt-wasm-runtime" }
tpt-wasm-format = { path = "../crates/tpt-wasm-format" }
tpt-wasm-types = { path = "../crates/tpt-wasm-types" }
tpt-wasm-validate = { path = "../crates/tpt-wasm-validate" }
tpt-wasm-ir = { path = "../crates/tpt-wasm-ir" }

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "differential"
path = "fuzz_targets/differential.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jit"
path = "fuzz_targets/jit.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jit_module"
path = "fuzz_targets/jit_module.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
