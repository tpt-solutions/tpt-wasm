# TPT-Wasm Feature Registry
# Machine-readable record of WebAssembly proposal support.
# Used to generate compatibility documentation and gate CI tests.
#
# States: false = not implemented, "partial" = partial, true = complete
# Each feature should also have: tested, fuzzed, differential, verified

[core]
version = "3.0"
specification = "https://webassembly.github.io/spec/"

[features]
# WebAssembly MVP
mvp = "partial"

# Phase 4 proposals (shipped in browsers)
# "partial", not true: `ref.null`, `ref.func`, and `ref.is_null` are decoded,
# validated, lowered to the IR, and executed by both Micro and the baseline, and
# `funcref`/`externref` are accepted in signatures, locals, globals, and block
# result types. Still missing: `table.get`/`table.set` (0x25/0x26), an
# `externref` table, passive and declarative element segments, and
# `table.grow`/`table.size`/`table.fill`.
reference_types    = "partial"
bulk_memory        = false
simd               = false
multi_value        = false
# The five sign-extension opcodes (0xc0-0xc4) are decoded, validated, lowered
# to the IR, and executed by both Micro and the baseline; the Core suite's
# i32.wast/i64.wast exercise them end to end.
sign_extension_ops = true
non_trapping_float_to_int = false

# Phase 4 / shipping
threads            = false
extended_const      = false

# Phase 3
exception_handling = false
memory64           = false
multi_memory       = false
tail_call          = false
relaxed_simd       = false

# Phase 2
gc                 = false
typed_function_references = false
memory_control     = false

# Planned / research
branch_hinting     = false
flexible_vectors   = false

[features.status]
mvp_decoded = "partial"
mvp_validated = "partial"
mvp_executed = "partial"
mvp_compiled = "partial"
mvp_tested = "partial"
mvp_fuzzed = "partial"
mvp_differential = "partial"
mvp_verified = "partial"
# Each feature above should also be tracked through this ladder:
# decoded    = binary format understood by decoder
# validated  = validation rules implemented
# executed   = interpreter executes it
# compiled   = compiler generates code for it
# tested     = spec tests pass
# fuzzed     = fuzz target exists
# differential = differential test exists
# verified   = formal property established
#
# The three `mvp_compiled`, `mvp_differential`, and `mvp_verified` entries were
# previously `false`, which understated the tree. What each one actually means
# today:
#
# mvp_differential — 65 tpt-wasm-codegen tests and 36 tpt-wasm-ir tests drive the
#   real validate -> IR -> baseline pipeline and assert identical results and the
#   same trap variant against Micro, including host calls through one shared
#   boundary. On top of the hand-written fixtures, a seeded generator builds
#   whole programs — blocks, branches, if/else, a counted loop, direct and
#   indirect calls, a br_table, and the reference instructions — and 25,000 of
#   them are compared per test run (250,000 swept locally), so agreement is a
#   property of the pipeline over a program population rather than of the cases
#   someone remembered to write. Extending the generator to control flow is what
#   exposed the branch defects recorded below, and the official spec suite now
#   runs the same comparison across 10,145 directives on both backends. Not
#   `true`: the reference-interpreter differential does not execute yet.
# mvp_compiled  — the portable baseline in tpt-wasm-codegen lowers and executes
#   every instruction the IR can represent, and EngineMode::Baseline runs it at
#   instantiation, including through a host boundary for imported functions, and
#   now passes the same Core suite directives Micro does. Not `true`: there is no
#   native x86-64/AArch64 backend.
# mvp_verified — V0-V3 are machine-checked in Lean 4 with no `sorry` and no
#   `axiom`. Not `true`: V1 is rule-to-interpreter agreement within the Lean
#   model rather than Lean-to-Rust equality, V2 is not yet lifted to the
#   `Valid(Module)` implication, and the V4 IR projection is an executable hook,
#   not a refinement proof.
#
# `reference_types` was `false` on the grounds that the validator's opcode table
# ended at 0xbf, so 0xd0-0xd2 were rejected and a module using them could not
# reach the interpreter. That is no longer true: the validator now type-checks
# those three opcodes, the IR lowers them, and both backends execute them. The
# entry moved to "partial" rather than true, because `table.get`/`table.set`, an
# `externref` table, and non-active element segments still have no form.
#
# `br_if` was treated as consuming its label's values on both paths, which is
# wrong: `br_if l` has type `[t* i32] -> [t*]`, so the fall-through keeps them.
# The validator rejected every module that branched to a value-carrying label,
# the IR lowerer dropped the values on the fall-through edge, and one test had
# recorded the wrong reading as intended behavior. All three are fixed. The
# mistake was invisible until the differential generator started emitting
# blocks and branches, because the hand-written fixtures only branched to void
# labels, where the two readings agree.
#
# `binary.wast` and `binary-leb128.wast` from the official suite now run in CI
# through the real decoder and validator: 218 assertions, 49 modules accepted
# and 154 rejected at the stage the spec requires, with 15 documented gaps.
# Building that harness found four real decoder bugs, all fixed: a function body
# did not have to end with the `end` opcode; declared local counts were not
# summed; a data segment could only be written in the form with no kind byte;
# and an element segment could only be active in table 0. The 15 remaining gaps
# are two features rather than fifteen defects: the bulk-memory instructions
# with their data count section, and function bodies being stored as raw bytes
# instead of parsed.
#
# `mvp_tested` is `"partial"` rather than `false`: 33 Core suite files now run
# through `crates/tpt-wasm-spec/tests/core_spec.rs`, driving 10,145 `invoke`/
# `assert_return`/`assert_trap`/`assert_exhaustion`/`register` directives through
# the real decode -> validate -> instantiate -> call pipeline with exact NaN
# bit-pattern checking -- once on the Micro backend and once on the compiled
# baseline, with the same asserted counts either way, so a backend that dropped a
# directive would fail rather than shrink its coverage. Not `true`: the remaining
# table, element, data, function, type, import/export, start, and linking families
# are not vendored, and several files are blocked on specific unimplemented
# proposals -- see `core_spec.rs`'s module doc, which records each file's reason.
#
# The memory family (address, align, endianness, load, store, memory, memory_size,
# memory_trap, memory_redundancy -- 981 directives) was added next and found no
# defects at all: the loads and stores, `memory.size`, active data segments, the
# advisory `memarg` alignment hint, little-endian ordering, and the
# out-of-bounds trap rules were already correct on both backends. That is a
# result worth stating plainly, because the previous three batches each found
# several. It did isolate one blocker: `memory_grow.wast` imports a memory across
# instances, which needs `register` wired into the engine's `Linker` and a
# baseline that shares its memory with the store rather than owning a private
# `BaselineMemory`, so that file stays out until linking exists.
#
# Running that suite on the baseline found six more real bugs, all fixed, and
# they are worth recording because five of them are in the lowering, which no
# hand-written fixture had reached:
#   - The baseline recursed to make a call with no depth bound, so `call.wast`'s
#     `runaway` exhausted the *host* stack and killed the process with
#     STATUS_STACK_OVERFLOW. That is a crash where the spec requires a trap. It
#     now refuses a call past `ResourceLimits::max_call_depth` with the same
#     `Trap::CallDepthExceeded` Micro raises, and the runtime passes in the same
#     limit, so both backends run out of depth on the same call.
#   - A `loop`'s label carried the block type's results rather than its
#     parameters, so a loop's result was dropped and the code after the loop read
#     whatever the enclosing stack held. MVP block types have no parameters, so a
#     loop label's type is empty; the results belong to the merge block.
#   - An `else` was skipped when the `then` arm had already reached a
#     terminator, so the whole `else` arm was lowered into the terminated `then`
#     block and dropped: `if (c) (then br $done) (else <the work>)` did nothing,
#     which turned `stack.wast`'s `fac-expr` into an endless loop.
#   - A `block`/`loop`/`if` opened in unreachable code still popped an `if`'s
#     condition off a stack that dead code never pushed onto, so any body with a
#     construct after an `unreachable`, `br`, or `return` failed to lower.
#   - Dead code did not consume instruction immediates. The body is one byte
#     stream, so stepping over an `i32.const` without its constant left the next
#     opcode being read from the middle of it and desynchronized every
#     instruction after; nine whole suites failed to lower at all.
#   - A dead `unreachable` overwrote the terminator of a block that had already
#     branched or returned, replacing a still-taken branch with a trap that was
#     not.
# A branch to a function's own label also jumped back to the function's entry
# block, re-running the body instead of returning, so `br_if` to the outermost
# label was an endless loop. That label now targets a dedicated exit block.
#
# `sign_extension_ops` was `false` because the five opcodes (0xc0-0xc4) were not
# implemented anywhere; running the new Core suite found this immediately, since
# `i32.wast`/`i64.wast` failed to instantiate at all. Now decoded, validated,
# lowered to the IR (a new `SignExtend` op), and executed by both Micro and the
# baseline.
#
# The Core suite found two more real bugs, both fixed:
#   - `tpt-wasm-decode`'s `value_type()`/`reference_type()` only recognized the
#     four numeric types (plus `funcref` for a table), so a function signature,
#     local, global, or table with a `funcref`/`externref` type could not
#     actually decode from real bytes -- despite the validator having accepted
#     these types since M6. The validator's support was unreachable.
#   - Micro's `branch()` used a block's result arity for every branch,
#     including a branch back to a `loop`'s start, which should carry the
#     loop's (here always zero) parameter arity instead. Any loop with a result
#     type that branched back to its own top with no operand -- an ordinary
#     shape, e.g. a loop that only produces a value on exit -- trapped with a
#     spurious stack underflow.
#
# `br_table` was wrong in the same area for a different reason: the lowerer
# popped the label's values before the selector, so the two were swapped and the
# branch carried the selector while the dispatch compared the carried value. Any
# selector differing from the value it carries therefore reached the wrong label,
# and the hand-written fixture had used a selector equal to its carried value.
# Each arm of the comparison chain also passed no values on its fall-through
# edge, and later arms named values that did not dominate them. Both are fixed.

[standards]
wasm_core   = "3.0"
wasi_preview2 = "pending"
component_model = "pending"

[semantics]
version = "0.1"
