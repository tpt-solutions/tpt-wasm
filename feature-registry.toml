# TPT-Wasm Feature Registry
# Machine-readable record of WebAssembly proposal support.
# Used to generate compatibility documentation and gate CI tests.
#
# States: false = not implemented, "partial" = partial, true = complete
# Each feature should also have: tested, fuzzed, differential, verified

[core]
version = "3.0"
specification = "https://webassembly.github.io/spec/"

[features]
# WebAssembly MVP
mvp = "partial"

# Phase 4 proposals (shipped in browsers)
# "partial", not true: `ref.null`, `ref.func`, and `ref.is_null` are decoded,
# validated, lowered to the IR, and executed by both Micro and the baseline, and
# `funcref`/`externref` are accepted in signatures, locals, globals, and block
# result types. Still missing: `table.get`/`table.set` (0x25/0x26), an
# `externref` table, passive and declarative element segments, and
# `table.grow`/`table.size`/`table.fill`.
reference_types    = "partial"
bulk_memory        = false
simd               = false
multi_value        = false
# The five sign-extension opcodes (0xc0-0xc4) are decoded, validated, lowered
# to the IR, and executed by both Micro and the baseline; the Core suite's
# i32.wast/i64.wast exercise them end to end.
sign_extension_ops = true
non_trapping_float_to_int = false

# Phase 4 / shipping
threads            = false
extended_const      = false

# Phase 3
exception_handling = false
memory64           = false
multi_memory       = false
tail_call          = false
relaxed_simd       = false

# Phase 2
gc                 = false
typed_function_references = false
memory_control     = false

# Planned / research
branch_hinting     = false
flexible_vectors   = false

[features.status]
mvp_decoded = "partial"
mvp_validated = "partial"
mvp_executed = "partial"
mvp_compiled = "partial"
mvp_tested = "partial"
mvp_fuzzed = "partial"
mvp_differential = "partial"
mvp_verified = "partial"
# Each feature above should also be tracked through this ladder:
# decoded    = binary format understood by decoder
# validated  = validation rules implemented
# executed   = interpreter executes it
# compiled   = compiler generates code for it
# tested     = spec tests pass
# fuzzed     = fuzz target exists
# differential = differential test exists
# verified   = formal property established
#
# The three `mvp_compiled`, `mvp_differential`, and `mvp_verified` entries were
# previously `false`, which understated the tree. What each one actually means
# today:
#
# mvp_differential — 65 tpt-wasm-codegen tests and 36 tpt-wasm-ir tests drive the
#   real validate -> IR -> baseline pipeline and assert identical results and the
#   same trap variant against Micro, including host calls through one shared
#   boundary. On top of the hand-written fixtures, a seeded generator builds
#   whole programs — blocks, branches, if/else, a counted loop, direct and
#   indirect calls, a br_table, and the reference instructions — and 25,000 of
#   them are compared per test run (250,000 swept locally), so agreement is a
#   property of the pipeline over a program population rather than of the cases
#   someone remembered to write. Extending the generator to control flow is what
#   exposed the branch defects recorded below, and the official spec suite now
#   runs the same comparison across 16,075 directives on both backends. A second
#   generator, `crates/tpt-wasm-spec/tests/differential.rs`, adds 2,000 more
#   seeded modules built through the project's own encoder and run on both
#   backends, comparing the return value, an exported counter global, and the trap
#   variant. Still not `true`: that generator does not drive the official
#   reference interpreter, and the spec suite covers only what upstream wrote a
#   test for.
# mvp_compiled  — the portable baseline in tpt-wasm-codegen lowers and executes
#   every instruction the IR can represent, and EngineMode::Baseline runs it at
#   instantiation, including through a host boundary for imported functions, and
#   now passes the same Core suite directives Micro does. Not `true`: there is no
#   native x86-64/AArch64 backend.
# mvp_verified — V0-V3 are machine-checked in Lean 4 with no `sorry` and no
#   `axiom`. Not `true`: V1 is rule-to-interpreter agreement within the Lean
#   model rather than Lean-to-Rust equality, V2 is not yet lifted to the
#   `Valid(Module)` implication, and the V4 IR projection is an executable hook,
#   not a refinement proof.
#
# `reference_types` was `false` on the grounds that the validator's opcode table
# ended at 0xbf, so 0xd0-0xd2 were rejected and a module using them could not
# reach the interpreter. That is no longer true: the validator now type-checks
# those three opcodes, the IR lowers them, and both backends execute them. The
# entry moved to "partial" rather than true, because `table.get`/`table.set`, an
# `externref` table, and non-active element segments still have no form.
#
# `br_if` was treated as consuming its label's values on both paths, which is
# wrong: `br_if l` has type `[t* i32] -> [t*]`, so the fall-through keeps them.
# The validator rejected every module that branched to a value-carrying label,
# the IR lowerer dropped the values on the fall-through edge, and one test had
# recorded the wrong reading as intended behavior. All three are fixed. The
# mistake was invisible until the differential generator started emitting
# blocks and branches, because the hand-written fixtures only branched to void
# labels, where the two readings agree.
#
# `binary.wast` and `binary-leb128.wast` from the official suite now run in CI
# through the real decoder and validator: 218 assertions, 49 modules accepted
# and 154 rejected at the stage the spec requires, with 15 documented gaps.
# Building that harness found four real decoder bugs, all fixed: a function body
# did not have to end with the `end` opcode; declared local counts were not
# summed; a data segment could only be written in the form with no kind byte;
# and an element segment could only be active in table 0. The 15 remaining gaps
# are two features rather than fifteen defects: the bulk-memory instructions
# with their data count section, and function bodies being stored as raw bytes
# instead of parsed.
#
# `mvp_tested` is `"partial"` rather than `false`: 45 Core suite files now run
# through `crates/tpt-wasm-spec/tests/core_spec.rs`, driving 16,075 `invoke`/
# `assert_return`/`assert_trap`/`assert_exhaustion`/`register` directives through
# the real decode -> validate -> instantiate -> call pipeline with exact NaN
# bit-pattern checking -- once on the Micro backend and once on the compiled
# baseline, with the same asserted counts either way, so a backend that dropped a
# directive would fail rather than shrink its coverage. Not `true`: the remaining
# table, element, data, function, type, import/export, start, and linking families
# are not vendored, and several files are blocked on specific unimplemented
# proposals -- see `core_spec.rs`'s module doc, which records each file's reason.
#
# The memory family (address, align, endianness, load, store, memory, memory_size,
# memory_trap, memory_redundancy -- 981 directives) was added next and found no
# defect in the memory instructions themselves: the loads and stores, memory.size,
# active data segments, the advisory memarg alignment hint, little-endian ordering,
# and the out-of-bounds trap rules were already correct on both backends. That is a
# result worth stating plainly, because the previous three batches each found
# several. It did isolate one blocker -- memory_grow.wast, whose last section
# imports a memory across instances -- and following that up found two more real
# bugs, both fixed:
#   - The spec harness's `register` directive only recorded a name in its own map
#     and put nothing in the engine's `Linker`, so a later module's import could
#     never resolve. `Linker::define_instance` already existed and was already
#     exercised by the runtime's own tests; the harness simply never called it.
#     Every cross-instance import the Core suite uses was therefore unrunnable.
#   - An exported memory's external type reported the minimum it was declared
#     with rather than its current length, and was snapshotted into the Linker at
#     registration time. WebAssembly matches an import against the exporting
#     instance's type when the *importing* module is instantiated, so a module
#     that grew a memory, exported it, and had another import it requiring the
#     size it was now was refused as an incompatible import. The type is read
#     from the store at resolution time now, and a memory reports its current
#     page count. `ExternalKind` existed only to carry that snapshot and is gone,
#     replaced by one accessor per kind so the stale value cannot come back.
# memory_grow.wast (106 directives) then passed entirely on Micro, and getting it
# onto the baseline was a design change rather than a patch: a compiled module
# owned a private `BaselineMemory`, so an imported memory had nowhere to live and
# the two backends each mutated only their own copy. `IrMemory` now records
# whether the memory is `imported`; a defined memory is allocated and published
# as a `SharedMemory` handle that the runtime keeps keyed by store address, an
# importing module looks that handle up and installs the same one, and `ExecState`
# locks it for the duration of a call. Re-exports need no special case, because
# the address is the original's however many times the memory is passed along.
# That work exposed one more bug: the external type of an exported memory was read
# from the store, which in baseline mode knows nothing about the compiled module's
# growth, so an importer was matched against a stale size. The length now comes
# from whichever backend owns the memory -- which is what makes the two backends
# agree on what a memory is, precisely the question a cross-instance import asks.
# memory_grow.wast now passes on both backends and joins the table.
#
# The next batch stopped guessing which un-vendored files were blocked on what.
# All 31 remaining Core candidates were downloaded and run against the harness,
# and their per-file failure counts chose the order of work. Nine of them
# (f32_cmp, f64_cmp, f32_bitwise, f64_bitwise -- 5,542 directives between them --
# plus float_memory, type, custom, inline-module, and unreached-invalid) passed
# on both backends untouched, so they went straight in; the probe is what showed
# the float relation and bit-level operators, float round trips through memory,
# and the validator's dead-code rules were already correct rather than merely
# unexamined. The probe also isolated three real gaps, all fixed:
#   - The harness never defined the `spectest` host module, so every Core file
#     importing one could not link. It is the reference interpreter's own test
#     fixture rather than part of WebAssembly, and its print functions exist only
#     to be called and discarded, so they are defined as no-ops. Its globals,
#     table, and memory are not defined, because this project still cannot import
#     those.
#   - The IR refused to lower any module with a start function, although the
#     runtime already ran one on either backend. A start function is module
#     metadata for the same reason exports are, so the refusal is simply gone;
#     carrying it in the IR too would give the lowerer a second, redundant way
#     to say the same thing.
#   - The baseline resolved a start function's index against the module's
#     *defined* functions only, refusing a module that nominates an IMPORTED
#     function as its start -- which the specification allows, and which Wasm's
#     ordering of imports first makes necessary. call_wasm_index does the split
#     in one place. Verified by reverting the fix and confirming the new test
#     fails, and only on the baseline.
#   - The harness could not instantiate a module written inline inside a
#     directive, nor read an exported global. The inline module now goes through
#     the From<RuntimeError> conversion rather than being flattened to a string,
#     so a start function that traps stays classified as a trap -- which is
#     exactly what (assert_trap (module ... (start ...))) asserts. Instance::global
#     reads the store, so a global.set that has already run is visible.
# Eleven files and 5,824 directives later the Core suite is 45 files / 16,075
# directives per backend, all passing on both.
#
# That left one question the earlier passes had only guessed at: is anything still
# blocked on an MVP gap rather than a proposal? Every remaining candidate was run
# and its DISTINCT failure reasons collected. The answer is no -- the Core suite is
# complete for MVP, and every un-vendored file needs at least one post-MVP
# proposal. The blockers, by file:
#   multi_value        block, br, fac, func, if, loop       (6; all InvalidBlockType)
#   reference_types    table, call_indirect, exports,       (multi-table, externref,
#                      select, elem, br_table                and unrecognized heap types)
#   bulk_memory        data, token, elem                    (passive segments)
#   non_trapping_...   conversions                          (0xfc saturating truncs)
#   extended_const     global                               (0x6c in initializers)
#   exceptions         imports, unwind                      (tag section)
#   typed_references   local_init                           ((ref null extern))
# `names.wast` is rejected by the `wast` crate's own lexer before this harness
# sees it. So the remaining Core-suite work is proposal work, tracked per proposal
# in this file, and there is no separate "finish MVP" item behind them.
#
# Two things this retired as false leads. `spectest`'s globals, table, and memory
# are deliberately not installed: every file wanting them also wants a proposal,
# so installing them buys no coverage while letting a fabricated global stand in
# for a real one. And a global or table *import* is not on the critical path --
# the only files wanting one (imports, elem, global) need a proposal regardless.
#
# Writing the global test did turn up a real bug, the same shape as the stale
# memory size: a compiled module kept its globals in a private Vec while the store
# kept a second copy, so on Baseline Instance::global returned the initializer
# forever and a compiled global.set was invisible to it. BaselineModule.globals is
# now one shared handle per global, published per store address in the same
# registry the memory uses, and Instance::global reads through whichever backend
# owns the value. The test is written to run on both backends -- it was written for
# Micro first, and the divergence was invisible until the loop over modes was
# added.
#
# Table and global *imports* were then built anyway, since they are core MVP with
# no unblocked spec coverage -- the worse gap of the two. The IR lists globals and
# tables in Wasm index order with imports first, so global.get/global.set/
# call_indirect carry the index the module already used and the verifier needs no
# rebasing rule; a global's init became Option<Value> so an imported one has no
# value at all rather than a placeholder reading as a legitimate zero; and each
# global became one shared handle, because an imported global has to be the
# exporter's value and not a copy of it.
#
# One real divergence survives and is not patch-sized: a BaselineTable entry is an
# index into the owning module's own function list, so a table entry written by
# one module names nothing in a second, and a call_indirect through a shared table
# recurses into the dispatcher instead of reaching the installed function. Micro
# stores a store-wide function address and has no such limit. Fixing it means a
# table entry must name an instance as well as an index -- a redesign of
# IrTable::elements and of RefFunc resolution, with an ownership cycle between a
# shared table and the module owning its functions. No spec file reaches it.
#
# Separately, ResourceLimits::max_execution_steps was honoured by Micro and ignored
# entirely by the baseline, so an embedder asking for an instruction bound got it
# on one backend only. The baseline now carries the same budget, shared by every
# frame of an execution rather than per frame (a fresh allowance per call would
# let a recursive function run forever), and charges it before each instruction so
# the trap lands on the same instruction either way.
#
# Separately, RuntimeError::UnsupportedFeature for a failed lower_and_verify now
# carries the underlying reason instead of the bare stage name "baseline
# lowering". Naming the payload is what turned one vague message into the two
# distinct real causes while this was being written: a stale `table and global
# imports` rejection, and a global index resolved against the defined-globals
# section rather than the combined list.
#
# Running that suite on the baseline found six more real bugs, all fixed, and
# they are worth recording because five of them are in the lowering, which no
# hand-written fixture had reached:
#   - The baseline recursed to make a call with no depth bound, so `call.wast`'s
#     `runaway` exhausted the *host* stack and killed the process with
#     STATUS_STACK_OVERFLOW. That is a crash where the spec requires a trap. It
#     now refuses a call past `ResourceLimits::max_call_depth` with the same
#     `Trap::CallDepthExceeded` Micro raises, and the runtime passes in the same
#     limit, so both backends run out of depth on the same call.
#   - A `loop`'s label carried the block type's results rather than its
#     parameters, so a loop's result was dropped and the code after the loop read
#     whatever the enclosing stack held. MVP block types have no parameters, so a
#     loop label's type is empty; the results belong to the merge block.
#   - An `else` was skipped when the `then` arm had already reached a
#     terminator, so the whole `else` arm was lowered into the terminated `then`
#     block and dropped: `if (c) (then br $done) (else <the work>)` did nothing,
#     which turned `stack.wast`'s `fac-expr` into an endless loop.
#   - A `block`/`loop`/`if` opened in unreachable code still popped an `if`'s
#     condition off a stack that dead code never pushed onto, so any body with a
#     construct after an `unreachable`, `br`, or `return` failed to lower.
#   - Dead code did not consume instruction immediates. The body is one byte
#     stream, so stepping over an `i32.const` without its constant left the next
#     opcode being read from the middle of it and desynchronized every
#     instruction after; nine whole suites failed to lower at all.
#   - A dead `unreachable` overwrote the terminator of a block that had already
#     branched or returned, replacing a still-taken branch with a trap that was
#     not.
# A branch to a function's own label also jumped back to the function's entry
# block, re-running the body instead of returning, so `br_if` to the outermost
# label was an endless loop. That label now targets a dedicated exit block.
#
# `sign_extension_ops` was `false` because the five opcodes (0xc0-0xc4) were not
# implemented anywhere; running the new Core suite found this immediately, since
# `i32.wast`/`i64.wast` failed to instantiate at all. Now decoded, validated,
# lowered to the IR (a new `SignExtend` op), and executed by both Micro and the
# baseline.
#
# The Core suite found two more real bugs, both fixed:
#   - `tpt-wasm-decode`'s `value_type()`/`reference_type()` only recognized the
#     four numeric types (plus `funcref` for a table), so a function signature,
#     local, global, or table with a `funcref`/`externref` type could not
#     actually decode from real bytes -- despite the validator having accepted
#     these types since M6. The validator's support was unreachable.
#   - Micro's `branch()` used a block's result arity for every branch,
#     including a branch back to a `loop`'s start, which should carry the
#     loop's (here always zero) parameter arity instead. Any loop with a result
#     type that branched back to its own top with no operand -- an ordinary
#     shape, e.g. a loop that only produces a value on exit -- trapped with a
#     spurious stack underflow.
#
# `br_table` was wrong in the same area for a different reason: the lowerer
# popped the label's values before the selector, so the two were swapped and the
# branch carried the selector while the dispatch compared the carried value. Any
# selector differing from the value it carries therefore reached the wrong label,
# and the hand-written fixture had used a selector equal to its carried value.
# Each arm of the comparison chain also passed no values on its fall-through
# edge, and later arms named values that did not dominate them. Both are fixed.

[standards]
wasm_core   = "3.0"
wasi_preview2 = "pending"
component_model = "pending"

[semantics]
version = "0.1"
