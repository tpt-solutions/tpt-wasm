[graph]
targets = []

[advisories]
# `unmaintained` is intentionally omitted: its accepted values differ between
# cargo-deny releases (allow/warn/deny in older ones, all/workspace/transitive/none
# in 0.18+), and the CI action's binary rejects either form the other expects.
yanked = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
