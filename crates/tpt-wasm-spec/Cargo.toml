[package]
name = "tpt-wasm-spec"
description = "Official WebAssembly spec test harness for tpt-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tpt-wasm-decode.workspace = true
tpt-wasm-validate.workspace = true
tpt-wasm-runtime.workspace = true
tpt-wasm-types.workspace = true
wast = { version = "259", default-features = false, features = ["wasm-module"] }

# The differential harness builds modules structurally rather than parsing text,
# so it needs the format types the encoder consumes. Not a normal dependency: the
# harness lives in `tests/`, and nothing in the library uses it.
[dev-dependencies]
tpt-wasm-format.workspace = true
