[package]
name = "tpt-wasm-runtime"
description = "WebAssembly runtime (Store, Instance, Linker, Engine) for tpt-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/tpt-wasm-runtime"
keywords = ["webassembly", "wasm", "runtime", "engine", "interpreter"]
categories = ["wasm", "virtualization"]

[dependencies]
tpt-wasm-format.workspace = true
tpt-wasm-decode.workspace = true
tpt-wasm-types.workspace = true
tpt-wasm-validate.workspace = true
tpt-wasm-micro.workspace = true
tpt-wasm-ir.workspace = true
tpt-wasm-codegen.workspace = true
tpt-wasm-opt.workspace = true
tpt-wasm-capability.workspace = true
sha2 = "0.11"
# The native tier. On by default, so `EngineMode::Jit` works in a default build. The JIT carries the
# only `unsafe` in the compiled path; `--no-default-features` builds without it, and then
# `EngineMode::Jit` is refused.
tpt-wasm-jit = { workspace = true, optional = true }
# The on-disk cache of compiled native code stores module artifacts, so it needs the AOT format.
tpt-wasm-aot = { workspace = true, optional = true }

[features]
default = ["jit"]
jit = ["dep:tpt-wasm-jit", "dep:tpt-wasm-aot"]

[[example]]
name = "native_bench"
required-features = ["jit"]
